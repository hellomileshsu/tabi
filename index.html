<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>タビ的日誌</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
<script>if(localStorage.getItem("dm")==="1")document.documentElement.dataset.dark="1";</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f6f5f4; --card:#ffffff; --text:#37352f;
  --muted:#787672; --border:rgba(0,0,0,0.09); --pill:#f0efed;
  --input-bg:#ffffff; --input-border:#d9d9d7;
  --shadow:rgba(0,0,0,0.04) 0px 4px 18px,rgba(0,0,0,0.027) 0px 2px 7.85px,rgba(0,0,0,0.02) 0px 0.8px 2.93px,rgba(0,0,0,0.01) 0px 0.175px 1.04px;
  --sidebar-bg:#fbfaf9;
}
[data-dark="1"] {
  --bg:#1a1918; --card:#212120; --text:rgba(255,255,255,0.87);
  --muted:#6b6b69; --border:rgba(255,255,255,0.09); --pill:#2c2b29;
  --input-bg:#252423; --input-border:rgba(255,255,255,0.14);
  --shadow:0 2px 8px rgba(0,0,0,0.35),0 1px 2px rgba(0,0,0,0.25); --sidebar-bg:#161514;
}
body { font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); transition:background .2s,color .2s; }
input,button { font-family:inherit; }
input:focus { outline:none; border-color:#0075de !important; box-shadow:0 0 0 3px rgba(0,117,222,0.12) !important; }
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator { filter:var(--cal-filter,none); cursor:pointer; opacity:.6; }
[data-dark="1"] { --cal-filter:invert(0.7); }
@media(min-width:768px) {
  .app-layout { flex-direction:row !important; }
  .sidebar { display:flex !important; width:200px !important; min-height:100vh; }
  .topbar { display:none !important; }
  .bottomnav { display:none !important; }
  .main-content { padding:28px 32px !important; }
  .content-grid { display:grid !important; grid-template-columns:1fr 1fr !important; gap:16px !important; align-items:start; }
  .full-col { grid-column:1/-1; }
  .stat-grid { grid-template-columns:repeat(4,1fr) !important; }
}
@media(max-width:767px) {
  .sidebar { display:none !important; }
  .stat-grid { grid-template-columns:1fr 1fr !important; }
  /* Last stat card alone in a row → span both columns */
  .stat-grid > *:last-child:nth-child(odd) { grid-column: 1 / -1; }
  /* Tighter card padding on mobile */
  .card { padding: 12px !important; }
  /* iPhone safe area: push content above home indicator */
  .main-content { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }
}
/* Bottom nav always respects safe area (PWA standalone) */
.bottomnav { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
/* Push topbar below Dynamic Island / status bar */
.topbar { padding-top: calc(12px + env(safe-area-inset-top, 0px)) !important; }
/* ── Hover states (pointer devices only) ── */
@media(hover:hover) {
  button { transition: background .14s, opacity .14s, border-color .14s, color .14s, filter .14s; }
  .btn-fill:hover:not(:disabled)        { filter: brightness(0.9); }
  .btn-ghost:hover:not(:disabled)       { background: var(--pill) !important; }
  .btn-icon:hover:not(:disabled)        { opacity: 1 !important; color: var(--text) !important; }
  .btn-danger-icon:hover:not(:disabled) { opacity: 1 !important; color: #E05C5C !important; }
  .nav-btn:hover                        { background: var(--pill) !important; }
  .hoverable:hover      { box-shadow: rgba(0,0,0,0.07) 0px 8px 24px, rgba(0,0,0,0.04) 0px 2px 8px; transform: translateY(-1px); }
  .hoverable-cell:hover { background: var(--pill) !important; }
}
.hoverable      { transition: box-shadow .15s, transform .15s; }
.hoverable-cell { transition: background .14s; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DB_URL = "https://tabi-data-default-rtdb.firebaseio.com";

const DEFAULT_FOODS = [
  { name: "乾飼料", kcalPer100g: 350, customizable: true },
  { name: "濕食罐頭", kcalPer100g: 90 },
  { name: "生食", kcalPer100g: 130 },
  { name: "零食", kcalPer100g: 300 },
  { name: "自訂", kcalPer100g: null },
];
const POOP_TYPES = ["尿尿", "大便"];
const PEE_STATUS  = ["正常", "偏少", "偏多", "深色", "血尿", "排尿困難"];
const POOP_STATUS = ["無異常", "帶血", "其他"];
const POOP_SHAPES = [
  { label: "粒粒分明", group: "便秘" },
  { label: "表面凹凸", group: "便秘" },
  { label: "微有裂痕", group: "正常" },
  { label: "表面光滑", group: "正常" },
  { label: "塊狀光滑", group: "腹瀉" },
  { label: "鬆散破碎", group: "腹瀉" },
  { label: "完全液態", group: "腹瀉" },
];

const C = {
  blue: "#0075de", teal: "#2a9d99", green: "#1aae39",
  orange: "#dd5b00", purple: "#7c3aed", danger: "#e03c3c",
  bg: "var(--bg)", card: "var(--card)", text: "var(--text)",
  muted: "var(--muted)", border: "var(--border)", pill: "var(--pill)",
};

const { useState, useEffect, useCallback, useRef } = React;

function calcDailyKcal(w, a, n) {
  if (!w || !a) return null;
  const rer = 70 * Math.pow(w, 0.75);
  const m = a < 4 ? 3.0 : a < 12 ? 2.5 : n ? 1.2 : 1.4;
  return Math.round(rer * m);
}
function birthdateToMonths(bd) {
  if (!bd) return null;
  const birth = new Date(bd + "T00:00:00");
  const now = new Date();
  const months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
  return Math.max(0, months);
}
function ageLabel(months) {
  if (months === null || months === undefined) return "";
  if (months < 1) return "不滿 1 個月";
  if (months < 12) return `${months} 個月`;
  const y = Math.floor(months / 12), r = months % 12;
  return r ? `${y} 歲 ${r} 個月` : `${y} 歲`;
}
function now() { return new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function today() { return todayISO(); }
function fmtDate(iso) { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${y}/${parseInt(m)}/${parseInt(d)}`; }
function fmtDateShort(iso) { if (!iso) return ""; const [,m,d] = iso.split("-"); return `${parseInt(m)}/${parseInt(d)}`; }

async function fbGet(path) {
  const res = await fetch(`${DB_URL}/${path}.json`);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function fbSet(path, data) {
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function useFirebase(path, init, pollMs = 5000) {
  const [val, setVal] = useState(init);
  const [status, setStatus] = useState("loading");
  const valRef = useRef(init);

  const load = useCallback(async () => {
    try {
      const data = await fbGet(path);
      const next = data === null ? init : data;
      valRef.current = next;
      setVal(next);
      setStatus("ready");
    } catch { setStatus("error"); }
  }, [path]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const id = setInterval(load, pollMs);
    return () => clearInterval(id);
  }, [load, pollMs]);

  const save = useCallback(async (updater) => {
    const next = typeof updater === "function" ? updater(valRef.current) : updater;
    valRef.current = next;
    setVal(next);
    try { await fbSet(path, next); } catch {}
  }, [path]);

  return [val, save, status];
}

const NAV = [
  { key: "summary",  label: "今日摘要", icon: "ri-home-5-line" },
  { key: "feed",     label: "餵食紀錄", icon: "ri-restaurant-2-line" },
  { key: "poop",     label: "如廁紀錄", icon: "ri-drop-line" },
  { key: "changelog", label: "更新日誌", icon: "ri-history-line" },
  { key: "settings",  label: "設定",    icon: "ri-settings-3-line" },
];

function App() {
  const [tab, setTab] = useState("summary");
  const [selectedDate, setSelectedDate] = useState(todayISO);
  const [dark, setDark] = useState(() => localStorage.getItem("dm") === "1");
  const [feeds, setFeeds, feedsStatus] = useFirebase("feeds", []);
  const [poops, setPoops, poopsStatus] = useFirebase("poops", []);
  const [changelog, setChangelog, changelogStatus] = useFirebase("changelog", []);
  const [profile, setProfile, profileStatus] = useFirebase("profile", { weightKg: "", ageMonths: "", neutered: true });
  const [avatar, setAvatar] = useFirebase("avatar", null);
  const [dryKcal, setDryKcal] = useFirebase("dryKcal", 350);
  const [customFoods, setCustomFoods] = useFirebase("customFoods", []);

  const toggleDark = () => {
    const next = !dark;
    setDark(next);
    document.documentElement.dataset.dark = next ? "1" : "0";
    localStorage.setItem("dm", next ? "1" : "0");
  };

  const synced = [feedsStatus, poopsStatus, changelogStatus, profileStatus].every(s => s === "ready");
  const error = [feedsStatus, poopsStatus, changelogStatus].some(s => s === "error");

  const foods = [
    ...DEFAULT_FOODS.filter(f => f.name !== "自訂").map(f => f.name === "乾飼料" ? { ...f, kcalPer100g: dryKcal } : f),
    ...(customFoods || []).map(f => ({ ...f, isCustomBrand: true })),
    { name: "自訂", kcalPer100g: null },
  ];
  const ageMonths = profile?.birthdate ? birthdateToMonths(profile.birthdate) : parseFloat(profile?.ageMonths);
  const dailyGoal = calcDailyKcal(parseFloat(profile?.weightKg), ageMonths, profile?.neutered) || 250;
  const todayFeeds = (feeds || []).filter(f => f.date === selectedDate);
  const todayPoops = (poops || []).filter(p => p.date === selectedDate);
  const totalKcal = todayFeeds.reduce((s, f) => s + (f.kcal || 0), 0);
  const addLog = (action, category, desc) => {
    const d = new Date();
    setChangelog(prev => [...(prev||[]), { id: d.getTime(), ts: d.toISOString(), date: todayISO(), action, category, desc }]);
  };
  const ctx = { feeds: feeds||[], setFeeds, poops: poops||[], setPoops, changelog: changelog||[], profile: profile||{}, setProfile, avatar, setAvatar, dryKcal, setDryKcal, customFoods: customFoods||[], setCustomFoods, foods, dailyGoal, todayFeeds, todayPoops, totalKcal, selectedDate, setSelectedDate, dark, toggleDark, addLog };

  const DarkBtn = () => (
    <button onClick={toggleDark} title={dark ? "切換亮色" : "切換暗色"} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, display: "flex", alignItems: "center", padding: 4 }}>
      <i className={dark ? "ri-sun-line" : "ri-moon-line"} />
    </button>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column" }}>
      <div className="app-layout" style={{ display: "flex", flex: 1 }}>
        <aside className="sidebar" style={{ display: "none", flexDirection: "column", background: "var(--sidebar-bg)", borderRight: `1px solid ${C.border}` }}>
          <div style={{ padding: "24px 20px 16px", display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
            {/* Avatar */}
            <div style={{ width: 72, height: 72, borderRadius: "50%", overflow: "hidden", border: `2px solid ${C.border}`, background: C.bg, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {avatar
                ? <img src={avatar} alt="cat avatar" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                : <i className="ri-cat-line" style={{ fontSize: 32, color: C.muted }} />}
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>タビ的日誌</div>
              <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{fmtDate(todayISO())}</div>
            </div>
          </div>
          <nav style={{ padding: "8px 12px", flex: 1 }}>
            {NAV.map(n => (
              <button key={n.key} onClick={() => setTab(n.key)} style={{
                display: "flex", alignItems: "center", gap: 10, width: "100%",
                padding: "9px 12px", borderRadius: 8, border: "none", cursor: "pointer",
                background: "transparent",
                borderLeft: `3px solid ${tab === n.key ? C.blue : "transparent"}`,
                color: tab === n.key ? C.blue : C.muted,
                fontWeight: tab === n.key ? 600 : 400, fontSize: 13, marginBottom: 2,
              }}>
                <i className={n.icon} style={{ fontSize: 16, width: 18, textAlign: "center" }} />{n.label}
              </button>
            ))}
          </nav>
          <div style={{ padding: "12px 16px", borderTop: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <i className={error ? "ri-cloud-off-line" : synced ? "ri-cloud-check-line" : "ri-cloud-line"} style={{ color: error ? C.danger : synced ? C.green : C.muted, fontSize: 14 }} />
              <span style={{ fontSize: 11, color: C.muted }}>{error ? "連線失敗" : synced ? "已同步" : "連線中…"}</span>
            </div>
            <DarkBtn />
          </div>
        </aside>

        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
          <header className="topbar" style={{ background: C.card, borderBottom: `1px solid ${C.border}`, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <i className="ri-bookmark-3-fill" style={{ color: C.blue, fontSize: 17 }} />
              <span style={{ fontSize: 15, fontWeight: 700, color: C.text }}>タビ的日誌</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <i className={error ? "ri-cloud-off-line" : synced ? "ri-cloud-check-line" : "ri-cloud-line"} style={{ color: error ? C.danger : synced ? C.green : C.muted, fontSize: 16 }} />
              <DarkBtn />
            </div>
          </header>

          <main className="main-content" style={{ flex: 1, padding: "16px 14px 88px", overflowY: "auto", overflowX: "hidden" }}>
            <div style={{ maxWidth: 960, margin: "0 auto" }}>
              {error && (
                <div style={{ marginBottom: 14, padding: "8px 12px", borderRadius: 8, fontSize: 12, color: C.danger, background: `${C.danger}12`, border: `1px solid ${C.danger}30` }}>
                  <i className="ri-error-warning-line" style={{ marginRight: 6 }} />Firebase 連線失敗，請確認網路或資料庫規則
                </div>
              )}
              <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 12, letterSpacing: "-0.3px" }}>
                {NAV.find(n => n.key === tab)?.label}
              </div>
              {tab !== "settings" && tab !== "changelog" && <DateNav selectedDate={selectedDate} setSelectedDate={setSelectedDate} />}
              {tab === "summary" && <Summary ctx={ctx} setTab={setTab} />}
              {tab === "feed" && <FeedTab ctx={ctx} />}
              {tab === "poop" && <PoopTab ctx={ctx} />}
              {tab === "changelog" && <ChangelogTab ctx={ctx} />}
              {tab === "settings" && <SettingsTab ctx={ctx} />}
            </div>
          </main>

          <nav className="bottomnav" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.border}`, display: "flex", zIndex: 100 }}>
            {NAV.map(n => (
              <button key={n.key} onClick={() => setTab(n.key)} className="nav-btn" style={{
                flex: 1, padding: "10px 0 8px", border: "none", background: "none", cursor: "pointer",
                color: tab === n.key ? C.blue : C.muted, fontSize: 11, fontWeight: tab === n.key ? 700 : 400,
                borderTop: `2px solid ${tab === n.key ? C.blue : "transparent"}`,
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
              }}>
                <i className={n.icon} style={{ fontSize: 20 }} />{n.label}
              </button>
            ))}
          </nav>
        </div>
      </div>
    </div>
  );
}

function DateNav({ selectedDate, setSelectedDate }) {
  const isToday = selectedDate === todayISO();
  const go = days => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + days);
    const next = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (next <= todayISO()) setSelectedDate(next);
  };
  const [y, m, d] = selectedDate.split("-");
  const weekday = ["日","一","二","三","四","五","六"][new Date(selectedDate + "T00:00:00").getDay()];
  const circBtn = active => ({
    width: 36, height: 36, borderRadius: "50%", border: `1px solid ${C.border}`,
    background: C.card, cursor: active ? "pointer" : "default",
    color: C.text, opacity: active ? 1 : 0.25,
    display: "flex", alignItems: "center", justifyContent: "center",
    fontSize: 18, flexShrink: 0,
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
      <button onClick={() => go(-1)} style={circBtn(true)}><i className="ri-arrow-left-s-line" /></button>

      {/* Clickable date card — opens native date picker */}
      <div style={{ flex: 1, position: "relative", background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "7px 14px", textAlign: "center", cursor: "pointer", overflow: "hidden" }}>
        <input type="date" value={selectedDate} max={todayISO()} onChange={e => e.target.value && setSelectedDate(e.target.value)}
          style={{ position: "absolute", inset: 0, opacity: 0, width: "100%", height: "100%", cursor: "pointer" }} />
        <div style={{ fontSize: 16, fontWeight: 700, color: C.text, lineHeight: 1.2 }}>
          {parseInt(m)}月{parseInt(d)}日
        </div>
        <div style={{ fontSize: 11, color: isToday ? C.green : C.muted, marginTop: 3, fontWeight: isToday ? 600 : 400 }}>
          {isToday ? "今天・" : ""}{y}年・週{weekday}
        </div>
      </div>

      <button onClick={() => go(1)} disabled={isToday} style={circBtn(!isToday)}><i className="ri-arrow-right-s-line" /></button>

      {!isToday && (
        <button onClick={() => setSelectedDate(todayISO())} style={{
          height: 36, padding: "0 14px", background: C.blue, color: "#fff",
          border: "none", borderRadius: 10, fontSize: 13, fontWeight: 700,
          cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0,
        }}>今天</button>
      )}
    </div>
  );
}

function MonthChart({ feeds, dailyGoal, selectedDate, setSelectedDate }) {
  const [chartYM, setChartYM] = useState(() => selectedDate.slice(0, 7));
  // Sync chart month when selectedDate jumps to a different month
  React.useEffect(() => {
    const ym = selectedDate.slice(0, 7);
    if (ym !== chartYM) setChartYM(ym);
  }, [selectedDate]);

  const [year, month] = chartYM.split("-").map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstWeekday = new Date(year, month - 1, 1).getDay(); // 0=Sun
  const ISO = todayISO();

  const dailyKcal = {};
  (feeds || []).forEach(f => {
    if (f.date && f.date.startsWith(chartYM))
      dailyKcal[f.date] = (dailyKcal[f.date] || 0) + (f.kcal || 0);
  });

  const goMonth = delta => {
    const d = new Date(year, month - 1 + delta, 1);
    const next = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    if (next <= ISO.slice(0,7)) setChartYM(next);
  };
  const canNext = chartYM < ISO.slice(0,7);
  const WEEKDAYS = ["日","一","二","三","四","五","六"];

  // Total cells = leading blanks + days
  const cells = [...Array(firstWeekday).fill(null),
    ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

  return (
    <Card style={{ marginBottom: 16 }}>
      {/* Month navigation header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={() => goMonth(-1)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 20, padding: "0 4px", display: "flex", alignItems: "center" }}>
          <i className="ri-arrow-left-s-line" />
        </button>
        <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{year} 年 {month} 月</span>
        <button onClick={() => goMonth(1)} disabled={!canNext} style={{ background: "none", border: "none", cursor: canNext ? "pointer" : "default", color: C.muted, fontSize: 20, opacity: canNext ? 1 : 0.25, padding: "0 4px", display: "flex", alignItems: "center" }}>
          <i className="ri-arrow-right-s-line" />
        </button>
      </div>

      {/* Weekday headers */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 4 }}>
        {WEEKDAYS.map(w => (
          <div key={w} style={{ textAlign: "center", fontSize: 10, fontWeight: 600, color: C.muted, padding: "2px 0" }}>{w}</div>
        ))}
      </div>

      {/* Day grid */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
        {cells.map((day, idx) => {
          if (!day) return <div key={`blank-${idx}`} />;
          const dateStr = `${chartYM}-${String(day).padStart(2,"0")}`;
          const kcal = dailyKcal[dateStr] || 0;
          const isSel = dateStr === selectedDate;
          const isToday = dateStr === ISO;
          const isFuture = dateStr > ISO;
          const pct = kcal > 0 ? Math.min(100, (kcal / dailyGoal) * 100) : 0;
          const R = 14, CIRC = 2 * Math.PI * R;
          const arcColor = kcal === 0 ? null
            : kcal > dailyGoal * 1.1 ? C.danger
            : kcal >= dailyGoal * 0.9 ? C.green
            : C.blue;
          const dashOffset = CIRC * (1 - pct / 100);
          return (
            <div key={day} onClick={() => !isFuture && setSelectedDate(dateStr)}
              style={{ cursor: isFuture ? "default" : "pointer", opacity: isFuture ? 0.3 : 1,
                display: "flex", flexDirection: "column", alignItems: "center",
                padding: "4px 2px", borderRadius: 8,
                background: isSel ? `${C.blue}18` : "transparent" }}>
              <svg viewBox="0 0 36 36" width="100%" style={{ maxWidth: 44, display: "block" }}>
                <circle cx="18" cy="18" r={R} fill="none" stroke="var(--border)" strokeWidth="2.5" />
                {arcColor && (
                  <circle cx="18" cy="18" r={R} fill="none" stroke={arcColor} strokeWidth="3"
                    strokeLinecap="round" strokeDasharray={CIRC} strokeDashoffset={dashOffset}
                    transform="rotate(-90 18 18)" />
                )}
                <text x="18" y="18" textAnchor="middle" dominantBaseline="central"
                  fontSize="10" fontWeight={isSel || isToday ? 700 : 400}
                  fill={isSel ? C.blue : isToday ? C.orange : "var(--muted)"}>{day}</text>
                {isToday && <circle cx="18" cy="28" r="1.5" fill={C.orange} />}
              </svg>
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 10, fontSize: 10, color: C.muted }}>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: C.blue, display: "inline-block" }} />未達標</span>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: C.green, display: "inline-block" }} />達標</span>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: C.danger, display: "inline-block" }} />超標</span>
        <span style={{ marginLeft: "auto" }}>點擊日期切換</span>
      </div>
    </Card>
  );
}

function curTimeStr() { const d = new Date(); return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0"); }

function processAvatar(file, cb) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 240;
      const canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx2d = canvas.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx2d.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, SIZE, SIZE);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

const CAT_TYPE_MAP = { "乾飼料": "乾飼料", "濕食罐頭": "罐頭", "生食": "生食", "零食": "零食" };

  const { feeds, setFeeds, foods, customFoods, todayFeeds, selectedDate, addLog } = ctx;

  const [brand, setBrand] = useState(null);
  const [customKcal, setCustomKcal] = useState("");
  const [grams, setGrams] = useState("");
  const [leftover, setLeftover] = useState("");
  const [timeInput, setTimeInput] = useState(curTimeStr);
  const [note, setNote] = useState("");
  const [showRef, setShowRef] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editDate, setEditDate] = useState("");
  const [editTime, setEditTime] = useState("");
  const [editGrams, setEditGrams] = useState("");
  const [editLeftover, setEditLeftover] = useState("");

  const brandsForCat = (customFoods || []).filter(f => f.type === CAT_TYPE_MAP[category]);
  const catPreset = categories.find(f => f.name === category);
  const kcalPer100 = brand
    ? brand.kcalPer100g
    : category === "自訂" ? parseFloat(customKcal) || 0 : catPreset?.kcalPer100g || 0;
  const eatenG = Math.max(0, (parseFloat(grams) || 0) - (parseFloat(leftover) || 0));
  const kcal = grams ? Math.round((eatenG / 100) * kcalPer100) : 0;
  const foodName = brand ? brand.name : category;

  const onCategoryChange = cat => { setCategory(cat); setBrand(null); };

  const add = () => {
    if (!grams) return;
    setFeeds(prev => [...(prev || []), {
      id: Date.now(), date: selectedDate, time: timeInput,
      food: foodName, grams: parseFloat(grams), leftover: parseFloat(leftover) || 0, kcal, note
    }]);
    addLog("新增", "餵食", `${foodName} ${grams}g · ${kcal} kcal`);
    setGrams(""); setLeftover(""); setNote(""); setTimeInput(curTimeStr());
  };

  const startEdit = f => { setEditId(f.id); setEditDate(f.date || selectedDate); setEditTime(f.time); setEditGrams(String(f.grams)); setEditLeftover(String(f.leftover || "")); };

  const saveEdit = f => {
    const foodItem = foods.find(x => x.name === f.food);
    const kPer100 = foodItem?.kcalPer100g || (f.grams > 0 ? Math.round(f.kcal / f.grams * 100) : 0);
    const eg = Math.max(0, (parseFloat(editGrams) || 0) - (parseFloat(editLeftover) || 0));
    const newKcal = Math.round((eg / 100) * kPer100);
    setFeeds(prev => (prev || []).map(x => x.id === f.id
      ? { ...x, date: editDate, time: editTime, grams: parseFloat(editGrams) || x.grams, leftover: parseFloat(editLeftover) || 0, kcal: newKcal }
      : x));
    addLog("編輯", "餵食", `${f.food} → ${editGrams}g · ${newKcal} kcal`);
    setEditId(null);
  };

  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card className="full-col">
        <SLabel>食物種類</SLabel>
        <PillGroup items={categories.map(f => f.name)} active={category} setActive={onCategoryChange} />
        {brandsForCat.length > 0 && (
          <div style={{ marginBottom: 12 }}>
            <SLabel>品牌（可選）</SLabel>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {brandsForCat.map(b => (
                <button key={b.id} onClick={() => setBrand(brand?.id === b.id ? null : b)} style={{
                  padding: "5px 14px", borderRadius: 99,
                  border: `1px solid ${brand?.id === b.id ? "transparent" : C.border}`,
                  background: brand?.id === b.id ? C.teal : C.pill,
                  color: brand?.id === b.id ? "#fff" : C.muted,
                  fontSize: 13, fontWeight: brand?.id === b.id ? 700 : 400, cursor: "pointer",
                }}>{b.name} <span style={{ fontSize: 10, opacity: 0.7 }}>({b.kcalPer100g})</span></button>
              ))}
            </div>
          </div>
        )}
        {category === "自訂" && <SInput label="熱量 (kcal/100g)" type="number" value={customKcal} onChange={e => setCustomKcal(e.target.value)} placeholder="例：200" />}
        {category === "乾飼料" && !brand && <div style={{ fontSize: 11, color: C.blue, marginBottom: 10 }}>目前設定：{catPreset?.kcalPer100g} kcal/100g</div>}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="份量 (g)" type="number" value={grams} onChange={e => setGrams(e.target.value)} placeholder="例：50" />
          <SInput label="剩食 (g，可選)" type="number" value={leftover} onChange={e => setLeftover(e.target.value)} placeholder="例：5" />
        </div>
        <SLabel>餵食時間</SLabel>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          {[["現在", null], ["早上", "07:00"], ["中午", "12:00"], ["晚上", "18:00"], ["宵夜", "21:00"]].map(([label, t]) => {
            const val = t || curTimeStr();
            const isNow = label === "現在";
            const active = !isNow && timeInput === t;
            return (
              <button key={label} onClick={() => setTimeInput(val)} style={{
                padding: "4px 11px", borderRadius: 6, fontSize: 12, fontWeight: active ? 700 : 400,
                border: `1px solid ${active ? C.blue : C.border}`,
                background: active ? `${C.blue}18` : "transparent",
                color: active ? C.blue : C.muted, cursor: "pointer",
              }}>{label}{t ? ` ${t}` : ""}</button>

        <SInput label="備註（可選）" value={note} onChange={e => setNote(e.target.value)} placeholder="例：很快吃完" />

      <Card className="full-col">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>

        </div>
        {showRef && (
          <div style={{ background: `${C.teal}10`, borderRadius: 10, padding: 12, marginBottom: 12, display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(150px,1fr))", gap: 6 }}>
            {foods.filter(f => f.kcalPer100g).map(f => (
              <div key={f.name + (f.id || "")} style={{ background: C.card, borderRadius: 7, padding: "7px 11px", border: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                <span style={{ color: C.text }}>{f.name}</span>
                <span style={{ color: C.blue, fontWeight: 600 }}>{f.kcalPer100g}</span>
              </div>
            ))}
          </div>
        )}
        {todayFeeds.length === 0 && <Empty />}
        {todayFeeds.map(f => editId === f.id ? (

            <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 8 }}>{f.food} 編輯中</div>

              <SInput label="份量 (g)" type="number" value={editGrams} onChange={e => setEditGrams(e.target.value)} />
              <SInput label="剩食 (g)" type="number" value={editLeftover} onChange={e => setEditLeftover(e.target.value)} placeholder="0" />
            </div>
            <div style={{ display: "flex", gap: 8 }}>

      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.text, marginBottom: 12 }}>今日紀錄</div>
        {todayPoops.length === 0 && <Empty />}
        {todayPoops.map(p => editId === p.id ? (
          <div key={p.id} style={{ padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 8 }}>{p.type} 編輯中</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(140px, 100%), 1fr))", gap: 8, marginBottom: 8 }}>
              <SInput label="日期" type="date" value={editDate} onChange={e => setEditDate(e.target.value)} max={todayISO()} />
              <SInput label="時間" type="time" value={editTime} onChange={e => setEditTime(e.target.value)} />
            </div>
            <SLabel>類型</SLabel>
            <PillGroup items={POOP_TYPES} active={editType} setActive={handleEditTypeChange} color={C.teal} />
            <SLabel>量</SLabel>
            <Counter value={editAmount} onChange={setEditAmount} unit={editType === "尿尿" ? "拳頭" : "塊"} />
            <SLabel>狀況</SLabel>
            <PillGroup items={editStatusOptions} active={editStatus} setActive={setEditStatus} color={C.teal} danger={editDangerItems} />
            {editIsPoop && <>
              <SLabel>便便形狀</SLabel>
              {shapeGroups.map(({ group, items }) => (
                <div key={group} style={{ marginBottom: 6 }}>
                  <div style={{ fontSize: 10, color: groupColor[group], fontWeight: 600, marginBottom: 4 }}>{group}</div>
                  <PillGroup items={items} active={editShape} setActive={setEditShape} color={C.teal} />
                </div>
              ))}
            </>}
            <SInput label="備註（可選）" value={editNote} onChange={e => setEditNote(e.target.value)} placeholder="例：貓砂量正常" />
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button onClick={() => saveEdit(p)} style={{ flex: 1, padding: "8px 0", background: C.teal, color: "#fff", border: "none", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>儲存</button>
              <button onClick={() => setEditId(null)} style={{ padding: "8px 16px", background: "transparent", color: C.muted, border: `1px solid ${C.border}`, borderRadius: 7, fontSize: 13, cursor: "pointer" }}>取消</button>
            </div>
          </div>
        ) : (
          <div key={p.id} style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "8px 0", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ flex: 1, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <Tag color={C.teal}>{p.time}</Tag>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{p.type}</span>
              <span style={{ fontSize: 12, color: C.muted }}>{p.amount}{p.type === "尿尿" ? "拳頭" : "塊"}</span>
              {p.shape && <span style={{ fontSize: 11, color: C.muted }}>{p.shape}</span>}
              <span style={{ fontSize: 12, color: (p.status === "正常" || p.status === "無異常") ? C.green : C.danger, fontWeight: 600, marginLeft: "auto" }}>{p.status}</span>
            </div>
            <button onClick={() => startEdit(p)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 15, display: "flex", alignItems: "center", opacity: 0.65 }}><i className="ri-pencil-line" /></button>
            <button onClick={() => { setPoops(prev => (prev||[]).filter(x => x.id !== p.id)); addLog("刪除", "如廁", `${p.type} ${p.amount||""}${p.type==="尿尿"?"拳頭":"塊"}`); }} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", opacity: 0.6 }}><i className="ri-delete-bin-6-line" /></button>
          </div>
        ))}
      </Card>
    </div>
  );
}

function ChangelogTab({ ctx }) {
  const { changelog } = ctx;
  const sorted = [...(changelog||[])].sort((a, b) => b.id - a.id);
  const grouped = sorted.reduce((acc, entry) => {
    (acc[entry.date] = acc[entry.date] || []).push(entry);
    return acc;
  }, {});
  const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
  const actionColor = { "新增": C.green, "刪除": C.danger, "編輯": C.orange };
  const categoryColor = { "餵食": C.blue, "如廁": C.teal };
  return (
    <div style={{ display: "grid", gap: 16 }}>
      {dates.length === 0 && (
        <Card><Empty /></Card>
      )}
      {dates.map(date => (
        <Card key={date}>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 10, letterSpacing: "0.04em" }}>{fmtDate(date)}</div>
          {grouped[date].map(entry => (
            <div key={entry.id} style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "7px 0", borderBottom: `1px solid ${C.border}` }}>
              <span style={{ fontSize: 10, color: C.muted, whiteSpace: "nowrap" }}>{entry.ts.slice(11,16)}</span>
              <span style={{ fontSize: 11, fontWeight: 700, color: actionColor[entry.action] || C.muted, background: `${actionColor[entry.action]}18`, padding: "2px 7px", borderRadius: 5 }}>{entry.action}</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: categoryColor[entry.category] || C.muted, background: `${categoryColor[entry.category]}18`, padding: "2px 7px", borderRadius: 5 }}>{entry.category}</span>
              <span style={{ fontSize: 12, color: C.text }}>{entry.desc}</span>
            </div>
          ))}
        </Card>
      ))}
    </div>
  );
}

function SettingsTab({ ctx }) {
  const { profile, setProfile, avatar, setAvatar, dryKcal, setDryKcal, customFoods, setCustomFoods } = ctx;
  const fileRef = React.useRef(null);
  const onAvatarFile = e => {
    const file = e.target.files?.[0];
    if (file) processAvatar(file, setAvatar);
    e.target.value = "";
  };
  const [w, setW] = useState(profile?.weightKg || "");
  const [birthdate, setBirthdate] = useState(profile?.birthdate || "");
  const [n, setN] = useState(profile?.neutered ?? true);
  const [d, setD] = useState(dryKcal || 350);
  const [saved, setSaved] = useState(false);
  const [brandType, setBrandType] = useState("乾飼料");
  const [brandName, setBrandName] = useState("");
  const [brandKcal, setBrandKcal] = useState("");
  const bdMonths = birthdateToMonths(birthdate);
  const preview = calcDailyKcal(parseFloat(w), bdMonths, n);
  const save = () => { setProfile({ weightKg: w, birthdate, neutered: n }); setDryKcal(parseFloat(d) || 350); setSaved(true); setTimeout(() => setSaved(false), 2000); };
  const addBrand = () => {
    if (!brandName.trim() || !brandKcal) return;
    setCustomFoods(prev => [...(prev||[]), { id: Date.now(), name: brandName.trim(), kcalPer100g: parseFloat(brandKcal), type: brandType }]);
    setBrandName(""); setBrandKcal("");
  };
  const delBrand = id => setCustomFoods(prev => (prev||[]).filter(f => f.id !== id));
  const typeColor = { "乾飼料": C.blue, "罐頭": C.teal, "生食": C.green, "零食": C.orange, "其他": C.purple };
  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>貓咪大頭貼</div>
        <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onAvatarFile} />
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          {/* Preview circle */}
          <div onClick={() => fileRef.current.click()} style={{ width: 88, height: 88, borderRadius: "50%", overflow: "hidden", border: `2px dashed ${C.border}`, background: C.bg, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", position: "relative" }}>
            {avatar
              ? <img src={avatar} alt="avatar" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
              : <i className="ri-cat-line" style={{ fontSize: 36, color: C.muted }} />}
            {/* hover overlay */}
            <div style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "rgba(0,0,0,0.28)", display: "flex", alignItems: "center", justifyContent: "center", opacity: 0 }}
              onMouseEnter={e => e.currentTarget.style.opacity = 1}
              onMouseLeave={e => e.currentTarget.style.opacity = 0}>
              <i className="ri-camera-line" style={{ color: "#fff", fontSize: 22 }} />
            </div>
          </div>
          <div>
            <div style={{ fontSize: 13, color: C.text, fontWeight: 600, marginBottom: 6 }}>點擊圖片上傳照片</div>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>支援 JPG、PNG、HEIC<br />自動裁切為正方形</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => fileRef.current.click()} style={{ fontSize: 12, padding: "5px 14px", borderRadius: 7, background: C.blue, color: "#fff", border: "none", cursor: "pointer", fontWeight: 600 }}>選擇照片</button>
              {avatar && <button onClick={() => setAvatar(null)} style={{ fontSize: 12, padding: "5px 14px", borderRadius: 7, background: "transparent", color: C.danger, border: `1px solid ${C.danger}40`, cursor: "pointer" }}>移除</button>}
            </div>
          </div>
        </div>
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>タビ 的基本資料</div>
        <SInput label="體重 (kg)" type="number" value={w} onChange={e => setW(e.target.value)} placeholder="例：4.2" />
        <SInput label="出生年月日" type="date" value={birthdate} max={todayISO()} onChange={e => setBirthdate(e.target.value)} />
        {bdMonths !== null && <div style={{ fontSize: 11, color: C.teal, marginBottom: 10 }}>= {ageLabel(bdMonths)}</div>}
        <SLabel>結紮狀態</SLabel>
        <PillGroup items={["已結紮", "未結紮"]} active={n ? "已結紮" : "未結紮"} setActive={v => setN(v === "已結紮")} />
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>每日熱量估算</div>
        {preview ? (
          <>
            <div style={{ fontSize: 36, fontWeight: 700, color: C.blue }}>{preview} <span style={{ fontSize: 14, color: C.muted }}>kcal</span></div>
            <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.8, marginTop: 8 }}>
              結紮成貓 ×1.2　未結紮成貓 ×1.4<br />
              成長期(&lt;12月) ×2.5　幼貓(&lt;4月) ×3.0
            </div>
          </>
        ) : <div style={{ color: C.muted, fontSize: 13 }}>請先填入體重和年紀</div>}
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>乾飼料熱量設定</div>
        <SInput label="乾飼料熱量 (kcal/100g)" type="number" value={d} onChange={e => setD(e.target.value)} placeholder="例：350" />
        <PrimaryBtn onClick={save} color={saved ? C.green : C.blue}>{saved ? "✓ 已儲存並同步！" : "儲存設定"}</PrimaryBtn>
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>自訂食物品牌</div>
        <SLabel>類型</SLabel>
        <PillGroup items={["乾飼料", "罐頭", "生食", "零食", "其他"]} active={brandType} setActive={setBrandType} color={typeColor[brandType]} />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="品牌 / 食物名稱" value={brandName} onChange={e => setBrandName(e.target.value)} placeholder="例：皇家腎臟處方" />
          <SInput label="熱量 (kcal/100g)" type="number" value={brandKcal} onChange={e => setBrandKcal(e.target.value)} placeholder="例：85" />
        </div>
        <PrimaryBtn onClick={addBrand} color={C.teal}>新增品牌</PrimaryBtn>
        {customFoods.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, color: C.muted, fontWeight: 600, marginBottom: 8 }}>已儲存的品牌</div>
            {customFoods.map(f => (
              <Row key={f.id} onDel={() => delBrand(f.id)}>
                <Tag color={typeColor[f.type] || C.muted}>{f.type}</Tag>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{f.name}</span>
                <span style={{ fontSize: 12, color: C.muted, marginLeft: "auto" }}>{f.kcalPer100g} kcal/100g</span>
              </Row>
            ))}
          </div>
        )}
        {customFoods.length === 0 && <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "10px 0", opacity: 0.5 }}>尚未新增自訂品牌</div>}
      </Card>
    </div>
  );
}

// UI helpers
function Card({ children, style, className }) {
  return <div className={`card${className ? " "+className : ""}`} style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: 20, boxShadow: "var(--shadow)", marginBottom: 0, ...style }}>{children}</div>;
}
function StatCard({ label, value, unit, color, onClick, sub }) {
  return (
    <div onClick={onClick} style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: 14, cursor: "pointer", boxShadow: "var(--shadow)" }}>
      <div style={{ fontSize: 10, color: C.muted, fontWeight: 500, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 3 }}>
        <span style={{ fontSize: 24, fontWeight: 700, color }}>{value}</span>
        <span style={{ fontSize: 11, color: C.muted }}>{unit}</span>
      </div>
      <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>{sub}</div>
    </div>
  );
}
function RecentList({ title, items, renderItem, color }) {
  return (
    <Card>
      <div style={{ fontWeight: 600, fontSize: 12, color, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>{title}</div>
      {items.length === 0 ? <div style={{ fontSize: 12, color: C.muted, opacity: 0.5 }}>尚無紀錄</div> : items.slice(-3).map((item, i) => (
        <div key={i} style={{ fontSize: 12, color: C.text, padding: "5px 0", borderBottom: `1px solid ${C.border}` }}>{renderItem(item)}</div>
      ))}
    </Card>
  );
}
function Counter({ value, onChange, unit }) {
  const btn = { width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", fontSize: 20, color: C.text, display: "flex", alignItems: "center", justifyContent: "center" };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
      <button onClick={() => onChange(Math.max(0.5, +(value - 0.5).toFixed(1)))} style={btn}>−</button>
      <span style={{ fontSize: 16, fontWeight: 700, color: C.text, minWidth: 48, textAlign: "center" }}>
        {value} <span style={{ fontSize: 12, color: C.muted, fontWeight: 400 }}>{unit}</span>
      </span>
      <button onClick={() => onChange(+(value + 0.5).toFixed(1))} style={btn}>+</button>
    </div>
  );
}
function PillGroup({ items, active, setActive, color, danger = [] }) {
  const ac = color || C.blue;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 12 }}>
      {items.map(item => {
        const isActive = active === item;
        const isDanger = danger.includes(item) && isActive;
        return (
          <button key={item} onClick={() => setActive(item)} style={{
            padding: "5px 14px", borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: isActive ? 600 : 500,
            border: `1px solid ${isActive && !isDanger ? ac : C.border}`,
            background: isDanger ? C.danger : isActive ? ac : C.pill,
            color: isActive ? "#fff" : C.text,
          }}>{item}</button>
        );
      })}
    </div>
  );
}
function SLabel({ children }) { return <div style={{ fontSize: 12, color: C.muted, marginBottom: 6, fontWeight: 500, letterSpacing: "0.01em" }}>{children}</div>; }
function SInput({ label, ...props }) {
  return (
    <div style={{ marginBottom: 12, minWidth: 0 }}>
      {label && <SLabel>{label}</SLabel>}
      <input {...props} style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 6, border: `1px solid var(--input-border)`, fontSize: 14, background: "var(--input-bg)", color: C.text }} />
    </div>
  );
}
function PrimaryBtn({ onClick, children, color }) {
  return <button onClick={onClick} className="btn-fill" style={{ width: "100%", padding: "11px 0", minHeight: 44, background: color || C.blue, color: "#fff", border: "none", borderRadius: 6, fontWeight: 600, fontSize: 14, cursor: "pointer", marginTop: 6, letterSpacing: "0.01em" }}>{children}</button>;
}
function Row({ children, onDel }) {
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "8px 0", borderBottom: `1px solid ${C.border}` }}>
      <div style={{ flex: 1, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>{children}</div>
      <button onClick={onDel} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", opacity: 0.6 }}><i className="ri-delete-bin-6-line" /></button>
    </div>
  );
}
function Tag({ children, color }) {
  return <span style={{ background: `${color}18`, color, fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 4, letterSpacing: "0.02em" }}>{children}</span>;
}
function Empty() { return <div style={{ color: C.muted, fontSize: 12, textAlign: "center", padding: "18px 0", opacity: 0.45 }}>尚無紀錄</div>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
