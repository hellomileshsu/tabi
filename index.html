<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>タビ的日誌</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
<script>if(localStorage.getItem("dm")==="1")document.documentElement.dataset.dark="1";</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F6F7FB; --card:#FFFFFF; --text:#1A1D2E;
  --muted:#8890A8; --border:#E6E9F4; --pill:#EEF0F8;
  --input-bg:#FFFFFF; --input-border:#DDE1EE;
  --shadow:0 1px 4px rgba(30,34,60,0.07); --sidebar-bg:#FFFFFF;
}
[data-dark="1"] {
  --bg:#10121A; --card:#181C28; --text:#DDE2F0;
  --muted:#4E5670; --border:#252A3C; --pill:#1E2234;
  --input-bg:#181C28; --input-border:#2A3048;
  --shadow:0 1px 6px rgba(0,0,0,0.3); --sidebar-bg:#141828;
}
body { font-family:'Noto Sans TC',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); transition:background .2s,color .2s; }
input,button { font-family:inherit; }
input:focus { outline:none; border-color:#5B8AF0 !important; box-shadow:0 0 0 3px rgba(91,138,240,0.12) !important; }
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator { filter:var(--cal-filter,none); cursor:pointer; opacity:.6; }
[data-dark="1"] { --cal-filter:invert(0.7); }
@media(min-width:768px) {
  .app-layout { flex-direction:row !important; }
  .sidebar { display:flex !important; width:200px !important; min-height:100vh; }
  .topbar { display:none !important; }
  .bottomnav { display:none !important; }
  .main-content { padding:28px 32px !important; }
  .content-grid { display:grid !important; grid-template-columns:1fr 1fr !important; gap:16px !important; align-items:start; }
  .full-col { grid-column:1/-1; }
  .stat-grid { grid-template-columns:repeat(4,1fr) !important; }
}
@media(max-width:767px) {
  .sidebar { display:none !important; }
  .stat-grid { grid-template-columns:1fr 1fr !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DB_URL = "https://tabi-data-default-rtdb.firebaseio.com";

const DEFAULT_FOODS = [
  { name: "乾飼料", kcalPer100g: 350, customizable: true },
  { name: "濕食罐頭", kcalPer100g: 90 },
  { name: "生食", kcalPer100g: 130 },
  { name: "零食", kcalPer100g: 300 },
  { name: "自訂", kcalPer100g: null },
];
const POOP_TYPES = ["尿尿", "大便"];
const POOP_STATUS = ["正常", "偏軟", "偏硬", "血絲", "其他"];
const ACTIVITY_TYPES = ["玩耍", "梳毛", "抱抱", "曬太陽", "外出", "其他"];

const C = {
  blue: "#5B8AF0", teal: "#3EBFB8", green: "#42BB87",
  orange: "#F5A623", purple: "#9B7FE8", danger: "#E05C5C",
  bg: "var(--bg)", card: "var(--card)", text: "var(--text)",
  muted: "var(--muted)", border: "var(--border)", pill: "var(--pill)",
};

const { useState, useEffect, useCallback, useRef } = React;

function calcDailyKcal(w, a, n) {
  if (!w || !a) return null;
  const rer = 70 * Math.pow(w, 0.75);
  const m = a < 4 ? 3.0 : a < 12 ? 2.5 : n ? 1.2 : 1.4;
  return Math.round(rer * m);
}
function now() { return new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function today() { return todayISO(); }
function fmtDate(iso) { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${y}/${parseInt(m)}/${parseInt(d)}`; }
function fmtDateShort(iso) { if (!iso) return ""; const [,m,d] = iso.split("-"); return `${parseInt(m)}/${parseInt(d)}`; }

async function fbGet(path) {
  const res = await fetch(`${DB_URL}/${path}.json`);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function fbSet(path, data) {
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function useFirebase(path, init, pollMs = 5000) {
  const [val, setVal] = useState(init);
  const [status, setStatus] = useState("loading");
  const valRef = useRef(init);

  const load = useCallback(async () => {
    try {
      const data = await fbGet(path);
      const next = data === null ? init : data;
      valRef.current = next;
      setVal(next);
      setStatus("ready");
    } catch { setStatus("error"); }
  }, [path]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const id = setInterval(load, pollMs);
    return () => clearInterval(id);
  }, [load, pollMs]);

  const save = useCallback(async (updater) => {
    const next = typeof updater === "function" ? updater(valRef.current) : updater;
    valRef.current = next;
    setVal(next);
    try { await fbSet(path, next); } catch {}
  }, [path]);

  return [val, save, status];
}

const NAV = [
  { key: "summary",  label: "今日摘要", icon: "ri-home-5-line" },
  { key: "feed",     label: "餵食紀錄", icon: "ri-restaurant-2-line" },
  { key: "poop",     label: "如廁紀錄", icon: "ri-drop-line" },
  { key: "activity", label: "活動紀錄", icon: "ri-run-line" },
  { key: "settings", label: "設定",     icon: "ri-settings-3-line" },
];

function App() {
  const [tab, setTab] = useState("summary");
  const [selectedDate, setSelectedDate] = useState(todayISO);
  const [dark, setDark] = useState(() => localStorage.getItem("dm") === "1");
  const [feeds, setFeeds, feedsStatus] = useFirebase("feeds", []);
  const [poops, setPoops, poopsStatus] = useFirebase("poops", []);
  const [acts, setActs, actsStatus] = useFirebase("acts", []);
  const [profile, setProfile, profileStatus] = useFirebase("profile", { weightKg: "", ageMonths: "", neutered: true });
  const [dryKcal, setDryKcal] = useFirebase("dryKcal", 350);
  const [customFoods, setCustomFoods] = useFirebase("customFoods", []);

  const toggleDark = () => {
    const next = !dark;
    setDark(next);
    document.documentElement.dataset.dark = next ? "1" : "0";
    localStorage.setItem("dm", next ? "1" : "0");
  };

  const synced = [feedsStatus, poopsStatus, actsStatus, profileStatus].every(s => s === "ready");
  const error = [feedsStatus, poopsStatus, actsStatus].some(s => s === "error");

  const foods = [
    ...DEFAULT_FOODS.filter(f => f.name !== "自訂").map(f => f.name === "乾飼料" ? { ...f, kcalPer100g: dryKcal } : f),
    ...(customFoods || []).map(f => ({ ...f, isCustomBrand: true })),
    { name: "自訂", kcalPer100g: null },
  ];
  const dailyGoal = calcDailyKcal(parseFloat(profile?.weightKg), parseFloat(profile?.ageMonths), profile?.neutered) || 250;
  const todayFeeds = (feeds || []).filter(f => f.date === selectedDate);
  const todayPoops = (poops || []).filter(p => p.date === selectedDate);
  const todayActs = (acts || []).filter(a => a.date === selectedDate);
  const totalKcal = todayFeeds.reduce((s, f) => s + (f.kcal || 0), 0);
  const ctx = { feeds: feeds||[], setFeeds, poops: poops||[], setPoops, acts: acts||[], setActs, profile: profile||{}, setProfile, dryKcal, setDryKcal, customFoods: customFoods||[], setCustomFoods, foods, dailyGoal, todayFeeds, todayPoops, todayActs, totalKcal, selectedDate, setSelectedDate, dark, toggleDark };

  const DarkBtn = () => (
    <button onClick={toggleDark} title={dark ? "切換亮色" : "切換暗色"} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, display: "flex", alignItems: "center", padding: 4 }}>
      <i className={dark ? "ri-sun-line" : "ri-moon-line"} />
    </button>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column" }}>
      <div className="app-layout" style={{ display: "flex", flex: 1 }}>
        <aside className="sidebar" style={{ display: "none", flexDirection: "column", background: "var(--sidebar-bg)", borderRight: `1px solid ${C.border}` }}>
          <div style={{ padding: "24px 20px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <i className="ri-bookmark-3-fill" style={{ color: C.blue, fontSize: 18 }} />
              <span style={{ fontSize: 15, fontWeight: 700, color: C.text }}>タビ的日誌</span>
            </div>
            <div style={{ fontSize: 11, color: C.muted, paddingLeft: 26 }}>{fmtDate(todayISO())}</div>
          </div>
          <nav style={{ padding: "8px 12px", flex: 1 }}>
            {NAV.map(n => (
              <button key={n.key} onClick={() => setTab(n.key)} style={{
                display: "flex", alignItems: "center", gap: 10, width: "100%",
                padding: "9px 12px", borderRadius: 8, border: "none", cursor: "pointer",
                background: "transparent",
                borderLeft: `3px solid ${tab === n.key ? C.blue : "transparent"}`,
                color: tab === n.key ? C.blue : C.muted,
                fontWeight: tab === n.key ? 600 : 400, fontSize: 13, marginBottom: 2,
              }}>
                <i className={n.icon} style={{ fontSize: 16, width: 18, textAlign: "center" }} />{n.label}
              </button>
            ))}
          </nav>
          <div style={{ padding: "12px 16px", borderTop: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <i className={error ? "ri-cloud-off-line" : synced ? "ri-cloud-check-line" : "ri-cloud-line"} style={{ color: error ? C.danger : synced ? C.green : C.muted, fontSize: 14 }} />
              <span style={{ fontSize: 11, color: C.muted }}>{error ? "連線失敗" : synced ? "已同步" : "連線中…"}</span>
            </div>
            <DarkBtn />
          </div>
        </aside>

        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <header className="topbar" style={{ background: C.card, borderBottom: `1px solid ${C.border}`, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <i className="ri-bookmark-3-fill" style={{ color: C.blue, fontSize: 17 }} />
              <span style={{ fontSize: 15, fontWeight: 700, color: C.text }}>タビ的日誌</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <i className={error ? "ri-cloud-off-line" : synced ? "ri-cloud-check-line" : "ri-cloud-line"} style={{ color: error ? C.danger : synced ? C.green : C.muted, fontSize: 16 }} />
              <DarkBtn />
            </div>
          </header>

          <main className="main-content" style={{ flex: 1, padding: "16px 14px 80px", overflowY: "auto" }}>
            <div style={{ maxWidth: 960, margin: "0 auto" }}>
              {error && (
                <div style={{ marginBottom: 14, padding: "8px 12px", borderRadius: 8, fontSize: 12, color: C.danger, background: `${C.danger}12`, border: `1px solid ${C.danger}30` }}>
                  <i className="ri-error-warning-line" style={{ marginRight: 6 }} />Firebase 連線失敗，請確認網路或資料庫規則
                </div>
              )}
              <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 12 }}>
                {NAV.find(n => n.key === tab)?.label}
              </div>
              {tab !== "settings" && <DateNav selectedDate={selectedDate} setSelectedDate={setSelectedDate} />}
              {tab === "summary" && <Summary ctx={ctx} setTab={setTab} />}
              {tab === "feed" && <FeedTab ctx={ctx} />}
              {tab === "poop" && <PoopTab ctx={ctx} />}
              {tab === "activity" && <ActivityTab ctx={ctx} />}
              {tab === "settings" && <SettingsTab ctx={ctx} />}
            </div>
          </main>

          <nav className="bottomnav" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.border}`, display: "flex", zIndex: 100 }}>
            {NAV.map(n => (
              <button key={n.key} onClick={() => setTab(n.key)} style={{
                flex: 1, padding: "8px 0 6px", border: "none", background: "none", cursor: "pointer",
                color: tab === n.key ? C.blue : C.muted, fontSize: 9, fontWeight: tab === n.key ? 700 : 400,
                borderTop: `2px solid ${tab === n.key ? C.blue : "transparent"}`,
                display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              }}>
                <i className={n.icon} style={{ fontSize: 18 }} />{n.label}
              </button>
            ))}
          </nav>
        </div>
      </div>
    </div>
  );
}

function DateNav({ selectedDate, setSelectedDate }) {
  const isToday = selectedDate === todayISO();
  const go = days => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + days);
    const next = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (next <= todayISO()) setSelectedDate(next);
  };
  const iconBtn = { background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, display: "flex", alignItems: "center", padding: "0 2px" };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 14, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "6px 10px" }}>
      <button onClick={() => go(-1)} style={iconBtn}><i className="ri-arrow-left-s-line" /></button>
      <input type="date" value={selectedDate} max={todayISO()} onChange={e => e.target.value && setSelectedDate(e.target.value)}
        style={{ border: "none", background: "none", fontSize: 13, fontWeight: 600, color: C.text, cursor: "pointer", flex: 1, textAlign: "center" }} />
      <button onClick={() => go(1)} disabled={isToday} style={{ ...iconBtn, opacity: isToday ? 0.3 : 1, cursor: isToday ? "default" : "pointer" }}><i className="ri-arrow-right-s-line" /></button>
      {!isToday && <button onClick={() => setSelectedDate(todayISO())} style={{ fontSize: 11, color: C.blue, background: `${C.blue}14`, border: "none", borderRadius: 6, padding: "3px 9px", cursor: "pointer", fontWeight: 600, whiteSpace: "nowrap" }}>今天</button>}
    </div>
  );
}

function MonthChart({ feeds, dailyGoal, selectedDate, setSelectedDate }) {
  const [chartYM, setChartYM] = useState(() => selectedDate.slice(0, 7));
  const [year, month] = chartYM.split("-").map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const ISO = todayISO();

  const dailyKcal = {};
  const dailyPoops = {};
  (feeds || []).forEach(f => {
    if (f.date && f.date.startsWith(chartYM)) {
      dailyKcal[f.date] = (dailyKcal[f.date] || 0) + (f.kcal || 0);
    }
  });

  const goMonth = delta => {
    const d = new Date(year, month - 1 + delta, 1);
    const next = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    if (next <= ISO.slice(0,7)) setChartYM(next);
  };
  const canNext = chartYM < ISO.slice(0,7);

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={() => goMonth(-1)} style={{ background: "none", border: "none", cursor: "pointer", color: C.muted, fontSize: 18, display: "flex", alignItems: "center" }}><i className="ri-arrow-left-s-line" /></button>
        <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{year} 年 {month} 月　熱量概覽</span>
        <button onClick={() => goMonth(1)} disabled={!canNext} style={{ background: "none", border: "none", cursor: canNext ? "pointer" : "default", color: C.muted, fontSize: 18, opacity: canNext ? 1 : 0.25, display: "flex", alignItems: "center" }}><i className="ri-arrow-right-s-line" /></button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(daysInMonth, 7)}, 1fr)`, gap: 3 }}>
        {Array.from({ length: daysInMonth }, (_, i) => {
          const day = i + 1;
          const dateStr = `${chartYM}-${String(day).padStart(2,"0")}`;
          const kcal = dailyKcal[dateStr] || 0;
          const pct = kcal > 0 ? Math.min(100, Math.round((kcal / dailyGoal) * 100)) : 0;
          const isSel = dateStr === selectedDate;
          const isFuture = dateStr > ISO;
          const barColor = isSel ? C.teal : kcal >= dailyGoal ? C.danger : C.blue;
          return (
            <div key={day} onClick={() => !isFuture && setSelectedDate(dateStr)}
              style={{ cursor: isFuture ? "default" : "pointer", textAlign: "center", opacity: isFuture ? 0.25 : 1 }}>
              <div style={{ height: 36, display: "flex", alignItems: "flex-end", justifyContent: "center", paddingBottom: 1 }}>
                <div style={{ width: "80%", borderRadius: "3px 3px 0 0", background: pct > 0 ? barColor : `${C.muted}25`,
                  height: pct > 0 ? `${Math.max(8, pct * 0.36)}px` : "2px", transition: "height .2s" }} />
              </div>
              <div style={{ fontSize: 9, color: isSel ? C.teal : C.muted, fontWeight: isSel ? 700 : 400 }}>{day}</div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 8, fontSize: 10, color: C.muted }}>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: C.blue, display: "inline-block" }} />未達標</span>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: C.danger, display: "inline-block" }} />超標</span>
        <span style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: C.teal, display: "inline-block" }} />選中日</span>
        <span style={{ marginLeft: "auto" }}>點擊日期切換</span>
      </div>
    </Card>
  );
}

function Summary({ ctx, setTab }) {
  const { todayFeeds, todayPoops, todayActs, totalKcal, dailyGoal, profile, feeds, selectedDate, setSelectedDate } = ctx;
  const pct = Math.min(100, Math.round((totalKcal / dailyGoal) * 100));
  const hasProfile = profile?.weightKg && profile?.ageMonths;
  const isToday = selectedDate === todayISO();
  const dayLabel = isToday ? "今日" : fmtDateShort(selectedDate);
  const lastFeed = todayFeeds[todayFeeds.length - 1];
  const lastPoop = todayPoops[todayPoops.length - 1];
  const lastAct = todayActs[todayActs.length - 1];
  return (
    <div>
      {!hasProfile && (
        <div style={{ background: `${C.blue}15`, border: `1px solid ${C.blue}30`, borderRadius: 12, padding: "10px 16px", marginBottom: 16, fontSize: 13, color: C.blue }}>
          前往「設定」輸入 タビ 的體重和年紀，計算精準每日熱量
        </div>
      )}
      <MonthChart feeds={feeds} dailyGoal={dailyGoal} selectedDate={selectedDate} setSelectedDate={setSelectedDate} />
      <div className="stat-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
        <StatCard label={`${dayLabel}熱量`} value={`${totalKcal}`} unit={`/ ${dailyGoal} kcal`} color={C.blue} onClick={() => setTab("feed")} sub={`${pct}% 每日目標`} />
        <StatCard label={`${dayLabel}餵食`} value={`${todayFeeds.length}`} unit="次" color={C.teal} onClick={() => setTab("feed")} sub={lastFeed ? `最後 ${lastFeed.time}` : "尚無紀錄"} />
        <StatCard label={`${dayLabel}如廁`} value={`${todayPoops.length}`} unit="次" color={C.green} onClick={() => setTab("poop")} sub={lastPoop ? `${lastPoop.time} · ${lastPoop.status}` : "尚無紀錄"} />
        <StatCard label={`${dayLabel}活動`} value={`${todayActs.length}`} unit="次" color="#9b7fe8" onClick={() => setTab("activity")} sub={lastAct ? `${lastAct.time} · ${lastAct.type}` : "尚無紀錄"} />
      </div>
      <Card style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.muted }}>熱量進度</span>
          <span style={{ fontSize: 22, fontWeight: 700, color: C.blue }}>{totalKcal} <span style={{ fontSize: 13, color: C.muted }}>kcal</span></span>
        </div>
        <div style={{ background: `${C.blue}15`, borderRadius: 99, height: 10, overflow: "hidden" }}>
          <div style={{ width: pct + "%", height: "100%", background: pct >= 100 ? C.danger : `linear-gradient(90deg,${C.blue},${C.teal})`, borderRadius: 99, transition: "width .4s" }} />
        </div>
        <div style={{ fontSize: 11, color: C.muted, marginTop: 6 }}>{pct}% · 目標 {dailyGoal} kcal</div>
      </Card>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 10 }}>{dayLabel}紀錄</div>
      <div className="content-grid" style={{ display: "grid", gap: 12 }}>
        <RecentList title="餵食" items={todayFeeds} renderItem={f => `${f.time}　${f.food} ${f.grams}g${f.leftover > 0 ? ` 剩${f.leftover}g` : ""}　${f.kcal} kcal`} color={C.blue} />
        <RecentList title="如廁" items={todayPoops} renderItem={p => `${p.time}　${p.type}　${p.status}`} color={C.teal} />
        <RecentList title="活動" items={todayActs} renderItem={a => `${a.time}　${a.type}${a.duration ? `　${a.duration}分鐘` : ""}`} color="#9b7fe8" />
      </div>
    </div>
  );
}

function curTimeStr() { const d = new Date(); return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0"); }

const CAT_TYPE_MAP = { "乾飼料": "乾飼料", "濕食罐頭": "罐頭", "生食": "生食", "零食": "零食" };

function FeedTab({ ctx }) {
  const { feeds, setFeeds, foods, customFoods, todayFeeds, selectedDate } = ctx;
  const categories = foods.filter(f => !f.isCustomBrand);
  const [category, setCategory] = useState(categories[0]?.name || "乾飼料");
  const [brand, setBrand] = useState(null);
  const [customKcal, setCustomKcal] = useState("");
  const [grams, setGrams] = useState("");
  const [leftover, setLeftover] = useState("");
  const [timeInput, setTimeInput] = useState(curTimeStr);
  const [note, setNote] = useState("");
  const [showRef, setShowRef] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editDate, setEditDate] = useState("");
  const [editTime, setEditTime] = useState("");
  const [editGrams, setEditGrams] = useState("");
  const [editLeftover, setEditLeftover] = useState("");

  const brandsForCat = (customFoods || []).filter(f => f.type === CAT_TYPE_MAP[category]);
  const catPreset = categories.find(f => f.name === category);
  const kcalPer100 = brand
    ? brand.kcalPer100g
    : category === "自訂" ? parseFloat(customKcal) || 0 : catPreset?.kcalPer100g || 0;
  const eatenG = Math.max(0, (parseFloat(grams) || 0) - (parseFloat(leftover) || 0));
  const kcal = grams ? Math.round((eatenG / 100) * kcalPer100) : 0;
  const foodName = brand ? brand.name : category;

  const onCategoryChange = cat => { setCategory(cat); setBrand(null); };

  const add = () => {
    if (!grams) return;
    setFeeds(prev => [...(prev || []), {
      id: Date.now(), date: selectedDate, time: timeInput,
      food: foodName, grams: parseFloat(grams), leftover: parseFloat(leftover) || 0, kcal, note
    }]);
    setGrams(""); setLeftover(""); setNote(""); setTimeInput(curTimeStr());
  };

  const startEdit = f => { setEditId(f.id); setEditDate(f.date || selectedDate); setEditTime(f.time); setEditGrams(String(f.grams)); setEditLeftover(String(f.leftover || "")); };

  const saveEdit = f => {
    const foodItem = foods.find(x => x.name === f.food);
    const kPer100 = foodItem?.kcalPer100g || (f.grams > 0 ? Math.round(f.kcal / f.grams * 100) : 0);
    const eg = Math.max(0, (parseFloat(editGrams) || 0) - (parseFloat(editLeftover) || 0));
    const newKcal = Math.round((eg / 100) * kPer100);
    setFeeds(prev => (prev || []).map(x => x.id === f.id
      ? { ...x, date: editDate, time: editTime, grams: parseFloat(editGrams) || x.grams, leftover: parseFloat(editLeftover) || 0, kcal: newKcal }
      : x));
    setEditId(null);
  };

  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card className="full-col">
        <SLabel>食物種類</SLabel>
        <PillGroup items={categories.map(f => f.name)} active={category} setActive={onCategoryChange} />
        {brandsForCat.length > 0 && (
          <div style={{ marginBottom: 12 }}>
            <SLabel>品牌（可選）</SLabel>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {brandsForCat.map(b => (
                <button key={b.id} onClick={() => setBrand(brand?.id === b.id ? null : b)} style={{
                  padding: "5px 14px", borderRadius: 99,
                  border: `1px solid ${brand?.id === b.id ? "transparent" : C.border}`,
                  background: brand?.id === b.id ? C.teal : C.pill,
                  color: brand?.id === b.id ? "#fff" : C.muted,
                  fontSize: 13, fontWeight: brand?.id === b.id ? 700 : 400, cursor: "pointer",
                }}>{b.name} <span style={{ fontSize: 10, opacity: 0.7 }}>({b.kcalPer100g})</span></button>
              ))}
            </div>
          </div>
        )}
        {category === "自訂" && <SInput label="熱量 (kcal/100g)" type="number" value={customKcal} onChange={e => setCustomKcal(e.target.value)} placeholder="例：200" />}
        {category === "乾飼料" && !brand && <div style={{ fontSize: 11, color: C.blue, marginBottom: 10 }}>目前設定：{catPreset?.kcalPer100g} kcal/100g</div>}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="份量 (g)" type="number" value={grams} onChange={e => setGrams(e.target.value)} placeholder="例：50" />
          <SInput label="剩食 (g，可選)" type="number" value={leftover} onChange={e => setLeftover(e.target.value)} placeholder="例：5" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="餵食時間" type="time" value={timeInput} onChange={e => setTimeInput(e.target.value)} />
          <div>
            <SLabel>實際進食熱量</SLabel>
            <div style={{ padding: "9px 12px", borderRadius: 10, background: `${C.blue}10`, border: `1px solid ${C.blue}25`, fontSize: 18, fontWeight: 700, color: C.blue }}>{kcal > 0 ? `${kcal} kcal` : "—"}</div>
          </div>
        </div>
        <SInput label="備註（可選）" value={note} onChange={e => setNote(e.target.value)} placeholder="例：很快吃完" />
        <PrimaryBtn onClick={add} color={C.blue}>新增餵食</PrimaryBtn>
      </Card>
      <Card className="full-col">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <span style={{ fontWeight: 700, fontSize: 14, color: C.text }}>今日紀錄</span>
          <button onClick={() => setShowRef(!showRef)} style={{ fontSize: 12, color: C.blue, background: "none", border: "none", cursor: "pointer" }}>熱量參考表 {showRef ? "▲" : "▼"}</button>
        </div>
        {showRef && (
          <div style={{ background: `${C.teal}10`, borderRadius: 10, padding: 12, marginBottom: 12, display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(150px,1fr))", gap: 6 }}>
            {foods.filter(f => f.kcalPer100g).map(f => (
              <div key={f.name + (f.id || "")} style={{ background: C.card, borderRadius: 7, padding: "7px 11px", border: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                <span style={{ color: C.text }}>{f.name}</span>
                <span style={{ color: C.blue, fontWeight: 600 }}>{f.kcalPer100g}</span>
              </div>
            ))}
          </div>
        )}
        {todayFeeds.length === 0 && <Empty />}
        {todayFeeds.map(f => editId === f.id ? (
          <div key={f.id} style={{ padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 8 }}>{f.food} 編輯中</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <SInput label="日期" type="date" value={editDate} onChange={e => setEditDate(e.target.value)} max={todayISO()} />
              <SInput label="時間" type="time" value={editTime} onChange={e => setEditTime(e.target.value)} />
              <SInput label="份量 (g)" type="number" value={editGrams} onChange={e => setEditGrams(e.target.value)} />
              <SInput label="剩食 (g)" type="number" value={editLeftover} onChange={e => setEditLeftover(e.target.value)} placeholder="0" />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => saveEdit(f)} style={{ flex: 1, padding: "8px 0", background: C.blue, color: "#fff", border: "none", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>儲存</button>
              <button onClick={() => setEditId(null)} style={{ padding: "8px 16px", background: "transparent", color: C.muted, border: `1px solid ${C.border}`, borderRadius: 7, fontSize: 13, cursor: "pointer" }}>取消</button>
            </div>
          </div>
        ) : (
          <div key={f.id} style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "9px 0", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ flex: 1, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <Tag color={C.blue}>{f.time}</Tag>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{f.food}</span>
              <span style={{ fontSize: 12, color: C.muted }}>{f.grams}g</span>
              {f.leftover > 0 && <span style={{ fontSize: 11, color: C.danger, fontWeight: 600 }}>剩 {f.leftover}g</span>}
              <span style={{ fontSize: 13, color: C.blue, fontWeight: 700, marginLeft: "auto" }}>{f.kcal} kcal</span>
            </div>
            <button onClick={() => startEdit(f)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 15, display: "flex", alignItems: "center", opacity: 0.65 }}><i className="ri-pencil-line" /></button>
            <button onClick={() => setFeeds(prev => (prev||[]).filter(x => x.id !== f.id))} style={{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 14, opacity: 0.55 }}>✕</button>
          </div>
        ))}
        {todayFeeds.length > 0 && (
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "flex-end" }}>
            <span style={{ fontSize: 13, color: C.muted }}>合計：</span>
            <span style={{ fontSize: 15, fontWeight: 700, color: C.blue, marginLeft: 6 }}>{todayFeeds.reduce((s, f) => s + f.kcal, 0)} kcal</span>
          </div>
        )}
      </Card>
    </div>
  );
}

function PoopTab({ ctx }) {
  const { poops, setPoops, todayPoops, selectedDate } = ctx;
  const [type, setType] = useState(POOP_TYPES[0]);
  const [status, setStatus] = useState(POOP_STATUS[0]);
  const [note, setNote] = useState("");
  const add = () => { setPoops(prev => [...(prev||[]), { id: Date.now(), date: selectedDate, time: now(), type, status, note }]); setNote(""); };
  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card>
        <SLabel>如廁類型</SLabel>
        <PillGroup items={POOP_TYPES} active={type} setActive={setType} color={C.teal} />
        <SLabel>狀況</SLabel>
        <PillGroup items={POOP_STATUS} active={status} setActive={setStatus} color={C.teal} danger={["血絲"]} />
        <SInput label="備註（可選）" value={note} onChange={e => setNote(e.target.value)} placeholder="例：貓砂量正常" />
        <PrimaryBtn onClick={add} color={C.teal}>新增如廁紀錄</PrimaryBtn>
      </Card>
      <Card>
        <div style={{ fontWeight: 700, fontSize: 14, color: C.text, marginBottom: 12 }}>今日紀錄</div>
        {todayPoops.length === 0 && <Empty />}
        {todayPoops.map(p => (
          <Row key={p.id} onDel={() => setPoops(prev => (prev||[]).filter(x => x.id !== p.id))}>
            <Tag color={C.teal}>{p.time}</Tag>
            <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{p.type}</span>
            <span style={{ fontSize: 12, color: p.status === "正常" ? C.green : C.danger, fontWeight: 600, marginLeft: "auto" }}>{p.status}</span>
          </Row>
        ))}
      </Card>
    </div>
  );
}

function ActivityTab({ ctx }) {
  const { acts, setActs, todayActs, selectedDate } = ctx;
  const [type, setType] = useState(ACTIVITY_TYPES[0]);
  const [duration, setDuration] = useState("");
  const [note, setNote] = useState("");
  const add = () => { setActs(prev => [...(prev||[]), { id: Date.now(), date: selectedDate, time: now(), type, duration, note }]); setDuration(""); setNote(""); };
  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card>
        <SLabel>活動類型</SLabel>
        <PillGroup items={ACTIVITY_TYPES} active={type} setActive={setType} color="#9b7fe8" />
        <SInput label="時長（分鐘，可選）" type="number" value={duration} onChange={e => setDuration(e.target.value)} placeholder="例：15" />
        <SInput label="備註（可選）" value={note} onChange={e => setNote(e.target.value)} placeholder="例：追逗貓棒" />
        <PrimaryBtn onClick={add} color="#9b7fe8">新增活動紀錄</PrimaryBtn>
      </Card>
      <Card>
        <div style={{ fontWeight: 700, fontSize: 14, color: C.text, marginBottom: 12 }}>今日紀錄</div>
        {todayActs.length === 0 && <Empty />}
        {todayActs.map(a => (
          <Row key={a.id} onDel={() => setActs(prev => (prev||[]).filter(x => x.id !== a.id))}>
            <Tag color="#9b7fe8">{a.time}</Tag>
            <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{a.type}</span>
            {a.duration && <span style={{ fontSize: 12, color: C.green, marginLeft: "auto" }}>{a.duration} 分鐘</span>}
          </Row>
        ))}
      </Card>
    </div>
  );
}

function SettingsTab({ ctx }) {
  const { profile, setProfile, dryKcal, setDryKcal, customFoods, setCustomFoods } = ctx;
  const [w, setW] = useState(profile?.weightKg || "");
  const [a, setA] = useState(profile?.ageMonths || "");
  const [n, setN] = useState(profile?.neutered ?? true);
  const [d, setD] = useState(dryKcal || 350);
  const [saved, setSaved] = useState(false);
  const [brandType, setBrandType] = useState("乾飼料");
  const [brandName, setBrandName] = useState("");
  const [brandKcal, setBrandKcal] = useState("");
  const preview = calcDailyKcal(parseFloat(w), parseFloat(a), n);
  const ageLabel = m => { if (!m) return ""; const mo = parseFloat(m); if (mo < 12) return `${mo} 個月`; const y = Math.floor(mo/12), r = mo%12; return r ? `${y} 歲 ${r} 個月` : `${y} 歲`; };
  const save = () => { setProfile({ weightKg: w, ageMonths: a, neutered: n }); setDryKcal(parseFloat(d) || 350); setSaved(true); setTimeout(() => setSaved(false), 2000); };
  const addBrand = () => {
    if (!brandName.trim() || !brandKcal) return;
    setCustomFoods(prev => [...(prev||[]), { id: Date.now(), name: brandName.trim(), kcalPer100g: parseFloat(brandKcal), type: brandType }]);
    setBrandName(""); setBrandKcal("");
  };
  const delBrand = id => setCustomFoods(prev => (prev||[]).filter(f => f.id !== id));
  const typeColor = { "乾飼料": C.blue, "罐頭": C.teal, "生食": C.green, "零食": C.orange, "其他": C.purple };
  return (
    <div className="content-grid" style={{ display: "grid", gap: 20 }}>
      <Card>
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>タビ 的基本資料</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="體重 (kg)" type="number" value={w} onChange={e => setW(e.target.value)} placeholder="例：4.2" />
          <SInput label="年紀（月齡）" type="number" value={a} onChange={e => setA(e.target.value)} placeholder="例：36" />
        </div>
        {a && <div style={{ fontSize: 11, color: C.teal, marginBottom: 10 }}>= {ageLabel(a)}</div>}
        <SLabel>結紮狀態</SLabel>
        <PillGroup items={["已結紮", "未結紮"]} active={n ? "已結紮" : "未結紮"} setActive={v => setN(v === "已結紮")} />
      </Card>
      <Card>
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>每日熱量估算</div>
        {preview ? (
          <>
            <div style={{ fontSize: 36, fontWeight: 700, color: C.blue }}>{preview} <span style={{ fontSize: 14, color: C.muted }}>kcal</span></div>
            <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.8, marginTop: 8 }}>
              結紮成貓 ×1.2　未結紮成貓 ×1.4<br />
              成長期(&lt;12月) ×2.5　幼貓(&lt;4月) ×3.0
            </div>
          </>
        ) : <div style={{ color: C.muted, fontSize: 13 }}>請先填入體重和年紀</div>}
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>乾飼料熱量設定</div>
        <SInput label="乾飼料熱量 (kcal/100g)" type="number" value={d} onChange={e => setD(e.target.value)} placeholder="例：350" />
        <PrimaryBtn onClick={save} color={saved ? C.green : C.blue}>{saved ? "✓ 已儲存並同步！" : "儲存設定"}</PrimaryBtn>
      </Card>
      <Card className="full-col">
        <div style={{ fontWeight: 700, fontSize: 14, color: C.blue, marginBottom: 14 }}>自訂食物品牌</div>
        <SLabel>類型</SLabel>
        <PillGroup items={["乾飼料", "罐頭", "生食", "零食", "其他"]} active={brandType} setActive={setBrandType} color={typeColor[brandType]} />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <SInput label="品牌 / 食物名稱" value={brandName} onChange={e => setBrandName(e.target.value)} placeholder="例：皇家腎臟處方" />
          <SInput label="熱量 (kcal/100g)" type="number" value={brandKcal} onChange={e => setBrandKcal(e.target.value)} placeholder="例：85" />
        </div>
        <PrimaryBtn onClick={addBrand} color={C.teal}>新增品牌</PrimaryBtn>
        {customFoods.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, color: C.muted, fontWeight: 600, marginBottom: 8 }}>已儲存的品牌</div>
            {customFoods.map(f => (
              <Row key={f.id} onDel={() => delBrand(f.id)}>
                <Tag color={typeColor[f.type] || C.muted}>{f.type}</Tag>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{f.name}</span>
                <span style={{ fontSize: 12, color: C.muted, marginLeft: "auto" }}>{f.kcalPer100g} kcal/100g</span>
              </Row>
            ))}
          </div>
        )}
        {customFoods.length === 0 && <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "10px 0", opacity: 0.5 }}>尚未新增自訂品牌</div>}
      </Card>
    </div>
  );
}

// UI helpers
function Card({ children, style, className }) {
  return <div className={className} style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: 16, boxShadow: "var(--shadow)", marginBottom: 0, ...style }}>{children}</div>;
}
function StatCard({ label, value, unit, color, onClick, sub }) {
  return (
    <div onClick={onClick} style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: 14, cursor: "pointer" }}>
      <div style={{ fontSize: 10, color: C.muted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 3 }}>
        <span style={{ fontSize: 24, fontWeight: 700, color }}>{value}</span>
        <span style={{ fontSize: 11, color: C.muted }}>{unit}</span>
      </div>
      <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>{sub}</div>
    </div>
  );
}
function RecentList({ title, items, renderItem, color }) {
  return (
    <Card>
      <div style={{ fontWeight: 600, fontSize: 12, color, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>{title}</div>
      {items.length === 0 ? <div style={{ fontSize: 12, color: C.muted, opacity: 0.5 }}>尚無紀錄</div> : items.slice(-3).map((item, i) => (
        <div key={i} style={{ fontSize: 12, color: C.text, padding: "5px 0", borderBottom: `1px solid ${C.border}` }}>{renderItem(item)}</div>
      ))}
    </Card>
  );
}
function PillGroup({ items, active, setActive, color, danger = [] }) {
  const ac = color || C.blue;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 12 }}>
      {items.map(item => {
        const isActive = active === item;
        const isDanger = danger.includes(item) && isActive;
        return (
          <button key={item} onClick={() => setActive(item)} style={{
            padding: "5px 13px", borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: isActive ? 600 : 400,
            border: `1px solid ${isActive && !isDanger ? ac : C.border}`,
            background: isDanger ? C.danger : isActive ? ac : "transparent",
            color: isActive ? "#fff" : C.muted,
          }}>{item}</button>
        );
      })}
    </div>
  );
}
function SLabel({ children }) { return <div style={{ fontSize: 11, color: C.muted, marginBottom: 5, fontWeight: 600, letterSpacing: "0.03em" }}>{children}</div>; }
function SInput({ label, ...props }) {
  return (
    <div style={{ marginBottom: 12 }}>
      {label && <SLabel>{label}</SLabel>}
      <input {...props} style={{ width: "100%", padding: "8px 11px", borderRadius: 8, border: `1px solid var(--input-border)`, fontSize: 14, background: "var(--input-bg)", color: C.text }} />
    </div>
  );
}
function PrimaryBtn({ onClick, children, color }) {
  return <button onClick={onClick} style={{ width: "100%", padding: "10px 0", background: color || C.blue, color: "#fff", border: "none", borderRadius: 8, fontWeight: 600, fontSize: 14, cursor: "pointer", marginTop: 6, letterSpacing: "0.02em" }}>{children}</button>;
}
function Row({ children, onDel }) {
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", padding: "8px 0", borderBottom: `1px solid ${C.border}` }}>
      <div style={{ flex: 1, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>{children}</div>
      <button onClick={onDel} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", opacity: 0.6 }}><i className="ri-delete-bin-6-line" /></button>
    </div>
  );
}
function Tag({ children, color }) {
  return <span style={{ background: `${color}18`, color, fontSize: 11, fontWeight: 600, padding: "2px 7px", borderRadius: 4 }}>{children}</span>;
}
function Empty() { return <div style={{ color: C.muted, fontSize: 12, textAlign: "center", padding: "18px 0", opacity: 0.45 }}>尚無紀錄</div>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
